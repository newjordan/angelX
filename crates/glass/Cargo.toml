[package]
name = "angel-glass"
version = "0.1.0"
description = "angelX's own window: a GPU compositor where the cockpit's text is one layer (docs/RENDER_FOUNDATION.md)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
remote = ["dep:serde", "dep:bincode", "dep:flate2", "dep:libc", "angel-stage/serde", "angel-gpu/serde", "crossterm/serde"]

[dependencies]
angel-stage = { path = "../stage" }
angel-gpu = { path = "../gpu" }
ratatui-core = { version = "0.1.2", features = ["std", "underline-color"] }
serde_json = "1"
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "vulkan", "metal"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
swash = "0.2"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1.0.1"
unicode-width = "0.2"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "qoi", "hdr", "ico", "pnm"] }
serde = { version = "1", features = ["derive", "rc"], optional = true }
bincode = { version = "1.3", optional = true }
flate2 = { version = "1", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }

[dev-dependencies]
angel-delve = { path = "../delve", features = ["testing", "bend-engine"] }
