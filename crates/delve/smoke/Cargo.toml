[package]
name = "angel-delve-smoke"
default-run = "angel-delve-smoke"
version = "0.1.0"
description = "The Delve's wasm smoke: frames drawn by the same renderer in wasm and natively, and how long each takes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
angel-delve = { path = "..", features = ["testing"] }
angel-net = { path = "../../net" }
serde_json = "1"

[[bin]]
name = "arcade-review"
path = "src/arcade.rs"
