[package]
name = "angel-stage"
version = "0.1.0"
description = "A game's scene as layers, and a 3D scene of nodes, meshes and materials: what the window (crates/glass) and the browser both draw (docs/RENDER_FOUNDATION.md, docs/GLASS_CORE.md)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Every description a remote window draws, as serde data (crates/glass
# `remote`, docs/REMOTE_GLASS.md).
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"], optional = true }
