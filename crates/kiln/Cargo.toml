[package]
name = "angel-kiln"
version = "0.1.0"
description = "Kiln: the Delve's pixel studio's hands, a recipe in and the realm's pixels out at any grain"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["encode"]
# PNG and GIF output (`encode`): the example sheets and the CLI write them.
encode = ["dep:png", "dep:gif"]
# The `kiln` command and its PNG and GIF output.
cli = ["encode"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A recipe's faults are named by their path (`parts[3].r`).
serde_path_to_error = "0.1"
png = { version = "0.18", optional = true }
gif = { version = "0.14", optional = true }

[[bin]]
name = "kiln"
required-features = ["cli"]
