[package]
name = "angel-bots"
version = "0.1.0"
description = "Load generator: N real WebSocket clients that join a muster and play, with measurements"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angel-net = { path = "../net" }
angel-serve = { path = "../serve" }
angel-muster = { path = "../muster" }

[dev-dependencies]
angel-serve = { path = "../serve", features = ["tls"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
