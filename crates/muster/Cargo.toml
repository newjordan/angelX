[package]
name = "angel-muster"
version = "0.1.0"
description = "The crowd test game: every player a knight on one field, with sheep"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angel-net = { path = "../net" }

# The server half and the host are native only; the client half builds for wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
angel-serve = { path = "../serve" }
