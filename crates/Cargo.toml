[workspace]
resolver = "3"
members = ["kingdom", "net", "stage", "gpu", "glass", "face", "term", "serve", "muster", "bots", "delve", "delve/smoke", "delve/dev-host", "web", "web/render", "web/testgame", "web/muster", "web/delve", "table", "probe-live", "wish-live", "wish-host", "live", "delve-system", "kiln", "realm-host", "games", "plug", "df-import"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.devfast]
inherits = "dev"
opt-level = 1
debug = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.angel-delve]
opt-level = 1

[profile.dev.package.angel-realm-host]
opt-level = 1

[profile.dev.package.angel-delve-system]
strip = "debuginfo"

[profile.web]
inherits = "release"
opt-level = 3
lto = "fat"
panic = "abort"
strip = "symbols"

[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

[profile.fast.package.angel-delve]
opt-level = 1

[profile.fast.package.angel-realm-host]
opt-level = 1

[profile.web-fast]
inherits = "web"
lto = false
codegen-units = 256
incremental = true

[profile.web-size]
inherits = "web-fast"
opt-level = 3
debug = false
strip = "symbols"
panic = "abort"
