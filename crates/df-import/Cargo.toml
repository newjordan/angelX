[package]
name = "angel-df-import"
version = "0.1.0"
description = "Turns a Dwarf Fortress fortress export (tools/angelx-kingdom-export.lua) into the Bomrekedan expansion's kingdom data"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "df-import"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
