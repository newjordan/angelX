[package]
name = "dotmax"
version = "0.1.8"
authors = ["Frosty"]
edition = "2021"
rust-version = "1.70"
description = "High-performance terminal braille rendering for images, animations, and graphics"
license = "MIT OR Apache-2.0"
repository = "https://github.com/newjordan/dotmax"
homepage = "https://github.com/newjordan/dotmax"
documentation = "https://docs.rs/dotmax"
readme = "README.md"
keywords = ["terminal", "braille", "graphics", "cli", "visualization"]
categories = ["command-line-interface", "graphics", "rendering"]
exclude = [
    # Hidden directories (dev tools and CI)
    ".github/",
    ".bmad/",
    ".claude/",
    ".augment/",
    ".gemini/",
    # Development documentation
    "docs/sprint-artifacts/",
    "docs/profiling/",
    "docs/adr/",
    "docs/*.yaml",
    "docs/bmm-*",
    "docs/*-2025-*.md",
    "docs/PRD.md",
    "docs/epics.md",
    "docs/research-*.md",
    "docs/implementation-*.md",
    "docs/sprint-*.md",
    # Test assets and fixtures (large images/files)
    "tests/visual/",
    "tests/assets/",
    "tests/fixtures/",
    "tests/test_assets/",
    # Community website assets and generated frontend files
    "site/",
    # Generated files
    "*.context.xml",
    # Planning docs
    "BRAILLE_GRAPHICS_MASTER_PLAN.md",
]

[dependencies]
# Core dependencies (always included)
# AngelX compatibility delta: upstream dotmax 0.1.9 still declares Ratatui 0.29,
# but this vendored 0.1.8 source compiles unchanged against 0.30.2. Keep the
# constraint aligned with the cockpit and recheck it during vendor refreshes.
ratatui = { version = "0.30.2", default-features = false }
crossterm = "0.29"       # Cross-platform terminal I/O
thiserror = "2.0"        # Error handling derive macros
tracing = "0.1"          # Structured logging
serde = { version = "1.0", features = ["derive"] }  # Frame-pack export format
serde_json = "1.0"       # Static web demo frame-pack writer

# Optional dependencies (feature-gated)
# AngelX compatibility delta: upstream declares imageproc, but this vendored
# source never calls it; direct image APIs implement every enabled image/video
# path. Keep the unused edge out so its maintenance-only graph cannot return.
image = { version = "0.25", optional = true }
gif = { version = "0.13", optional = true }
png = { version = "0.18", optional = true }  # For APNG animation support
resvg = { version = "0.38", optional = true }
usvg = { version = "0.38", optional = true }
ffmpeg-next = { version = "9.0", optional = true }  # For video playback (FFmpeg 9 / libavcodec 63)
anyhow = { version = "1.0", optional = true }       # Error handling for raytracer loaders
gltf = { version = "1.4", optional = true }         # glTF/GLB loading for raytracer
shakmaty = { version = "0.28", optional = true }    # Chess game logic for chess module
pgn-reader = { version = "0.27", optional = true }  # PGN parsing for chess module

[features]
default = []
image = ["dep:image", "dep:gif", "dep:png"]
svg = ["dep:resvg", "dep:usvg"]
video = ["dep:ffmpeg-next", "image"]  # Video requires image for frame rendering
raytracer = ["dep:anyhow", "dep:gltf"]  # CPU raytracer with braille output
chess = ["dep:shakmaty", "dep:pgn-reader"]  # Chess board rendering

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
tracing-subscriber = "0.3"
tempfile = "3.10"
proptest = "1.4"
static_assertions = "1.1"

