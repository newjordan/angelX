<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solved vs. agent time</title>
{{FONT_LINK}}
<style>
{{FONTS}}
/* site tokens only (website/css/style.css) */
:root{
  --bg:#050506; --bg-2:#0a0a0d; --ink:#f4f4f7; --dim:#a2a2ac; --faint:#5b5b66; --line:#26262d; --line-2:#3a3a44;
  --font-fantasy:'Cinzel','Times New Roman',Georgia,serif;
  --font-dos:'VT323','Courier New',ui-monospace,monospace;
  --font-mono:ui-monospace,'Cascadia Mono',Menlo,Consolas,'Courier New',monospace;
  /* bench.css: the angelX mark's ambient glow, held still */
  --glow:drop-shadow(0 0 1.3px rgba(244,244,247,.5)) drop-shadow(0 0 3.5px rgba(244,244,247,.24));
  --txt-glow:drop-shadow(0 0 1px rgba(244,244,247,.4));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
.letterhead{position:fixed;left:0;right:0;text-align:center;font-family:var(--font-dos);letter-spacing:.08em;color:var(--dim);z-index:2}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.mark{display:block;height:auto;filter:url(#tone)}

/* end card: logo-mark + angelx.dev (the letterhead stays on top) */
#end{flex-direction:column;gap:24px}
#end .mark{width:560px}
.end-url{font-family:var(--font-dos);font-size:44px;letter-spacing:.1em;color:var(--ink)}

/* the board: bench.css panel — thin square frame, title set into the border */
.stage{display:flex;flex-direction:column;align-items:center}
.sec-head{display:flex;flex-direction:column;align-items:center;text-align:center}
.sec-title{font-family:var(--font-fantasy);font-weight:700;letter-spacing:.04em;color:var(--ink);line-height:1.12}
.sec-sub{font-family:var(--font-dos);color:var(--dim);letter-spacing:.06em}
.tv{position:relative;border:1px solid var(--line-2);background:var(--bg-2)}
.tv-title{position:absolute;top:0;left:14px;transform:translateY(-55%);background:var(--bg);padding:0 10px;
  font-family:var(--font-mono);letter-spacing:.01em;color:var(--ink);white-space:nowrap}
svg#board{display:block;overflow:visible}
svg#board text{font-family:var(--font-dos)}
.t-ink{fill:var(--ink)} .t-dim{fill:var(--dim)}
.c-ok{fill:var(--ink);filter:var(--glow)}
.c-no{fill:none;stroke:var(--dim);stroke-width:1.6}
.c-slot{fill:var(--line-2)}
.txt-glow{filter:var(--txt-glow)}
.legend{display:flex;justify-content:center;align-items:center;gap:36px;border-top:1px dashed var(--line);
  font-family:var(--font-dos);letter-spacing:.06em;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:10px}
.legend .pass{background:var(--ink);filter:var(--glow);display:inline-block}
.legend .fail{border:1.5px solid var(--dim);display:inline-block}
.legend .hero{color:var(--ink)}
.provenance{text-align:center;font-family:var(--font-dos);letter-spacing:.04em;color:var(--dim)}

/* square: 1080 x 1080 */
.square .letterhead{top:26px;font-size:22px}
.square .stage{width:960px;margin-top:34px}
.square .sec-head .mark{width:240px}
.square .sec-title{font-size:40px;margin-top:12px}
.square .sec-sub{font-size:21px;letter-spacing:.03em;margin-top:4px}
.square .sec-head{margin-bottom:30px}
.square .tv{width:960px;padding:34px 26px 16px}
.square .tv-title{font-size:19px}
.square .legend{font-size:24px;margin-top:16px;padding-top:12px}
.square .legend .pass,.square .legend .fail{width:14px;height:14px}
.square .provenance{font-size:20px;margin-top:18px}

/* card: 1200 x 675, board only */
.card #end{display:none}
.card .letterhead{top:14px;font-size:17px}
.card .stage{width:1136px;margin-top:22px}
.card .sec-head .mark{width:170px}
.card .sec-title{font-size:28px;margin-top:6px}
.card .sec-sub{font-size:18px;margin-top:1px}
.card .sec-head{margin-bottom:20px}
.card .tv{width:1136px;padding:26px 24px 10px}
.card .tv-title{font-size:15px}
.card .legend{font-size:19px;margin-top:8px;padding-top:7px}
.card .legend .pass,.card .legend .fail{width:11px;height:11px}
.card .provenance{font-size:16px;margin-top:10px}
</style>
</head>
<body class="{{LAYOUT}}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- the site's #tone curve (index.html), applied to the chrome mark -->
  <filter id="tone" color-interpolation-filters="sRGB"><feComponentTransfer>
    <feFuncR type="linear" slope="1.35" intercept="-0.04"/>
    <feFuncG type="linear" slope="1.35" intercept="-0.04"/>
    <feFuncB type="linear" slope="1.35" intercept="-0.04"/>
  </feComponentTransfer></filter>
</defs></svg>
<p class="letterhead">{{LETTERHEAD}}</p>

<section class="scene" id="board-scene">
  <div class="stage" id="stage">
    <header class="sec-head">
      {{MARK}}
      <h1 class="sec-title">Benchmarks</h1>
      <p class="sec-sub" id="sub"></p>
    </header>
    <div class="tv">
      <p class="tv-title">Solved vs. agent time</p>
      <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="legend">
        <span class="hero"><i class="pass"></i>passed</span>
        <span><i class="fail"></i>failed</span>
      </div>
    </div>
    <footer class="provenance" id="prov"></footer>
  </div>
</section>

<section class="scene" id="end">
  {{MARK}}
  <p class="end-url">angelx.dev</p>
</section>

<script>
const BOARD = {{BOARD}};
const LAYOUT = '{{LAYOUT}}';
const PAGE_H = {{H}};
const NS = 'http://www.w3.org/2000/svg';
const COLS = 34, ROWS = 4;
const el = (p, t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); p.appendChild(n); return n; };
const clamp01 = v => Math.max(0, Math.min(1, v));

// site copy (website/benchmarks.html)
document.getElementById('sub').textContent =
  BOARD.tasks + ' repository-repair tasks (JS, Python, Rust, C++) · ' + BOARD.cap + ' s limit · graded by the evaluator';
document.getElementById('prov').textContent =
  'Graded by task-native test suites on Prime Intellect evaluators (' + BOARD.evaluator + ') · polyglot-v1';

const models = BOARD.models.map(m => {
  let t = 0;
  const done = m.attempts.map(a => (t += a[1]));
  return { ...m, done };
});
const T = Math.max(...models.map(m => m.total_s));
const fmtMin = s => (s / 60).toFixed(1) + ' min';

const S = LAYOUT === 'square'
  ? { name: 38, reason: 24, big: 56, den: 29, time: 24, readout: 24, gap: models.length >= 5 ? 20 : 30, pitchMax: 26, pitchMin: 12, margin: 40 }
  : { name: 30, reason: 21, big: 46, den: 25, time: 20, readout: 0, gap: 16, pitchMax: 20, pitchMin: 10, margin: 20 };

const svg = document.getElementById('board');
const tv = svg.parentNode;
const IW = tv.clientWidth - parseFloat(getComputedStyle(tv).paddingLeft) - parseFloat(getComputedStyle(tv).paddingRight);

function measure(text, size) {
  const n = el(svg, 'text', { 'font-size': size });
  n.textContent = text;
  const w = n.getComputedTextLength();
  n.remove();
  return w;
}

let parts = null;

function build(pitch) {
  while (svg.firstChild) svg.firstChild.remove();
  const cell = Math.max(4, Math.round(pitch * 0.78));
  const dot = Math.max(2, Math.round(cell * 0.24));
  const gridH = ROWS * pitch - (pitch - cell);
  const rightW = Math.max(measure(BOARD.tasks + ' / ' + BOARD.tasks, S.big) + 4, measure('000.0 min agent time', S.time));
  const nameW = LAYOUT === 'card'
    ? Math.max(...models.map(m => Math.max(measure(m.name, S.name), measure('thinking ' + m.thinking, S.reason)))) : 0;
  const nameH = LAYOUT === 'square' ? S.name + 12 : 0;
  const top = S.readout ? S.readout + 22 : 4;
  const blockH = LAYOUT === 'square' ? nameH + gridH : Math.max(gridH, S.name + S.reason + 8);
  const H = top + models.length * blockH + (models.length - 1) * S.gap + 6;
  svg.setAttribute('viewBox', `0 0 ${IW} ${H}`);
  svg.setAttribute('width', IW);
  svg.setAttribute('height', H);

  const readout = S.readout
    ? el(svg, 'text', { x: IW / 2, y: S.readout - 2, 'text-anchor': 'middle', 'font-size': S.readout, class: 't-dim' })
    : null;

  const rows = models.map((m, i) => {
    const y = top + i * (blockH + S.gap);
    let gx, gy;
    const g = el(svg, 'g', {});
    if (LAYOUT === 'square') {
      const t = el(g, 'text', { x: 0, y: y + S.name * 0.78, 'font-size': S.name, class: 't-ink' });
      const a = document.createElementNS(NS, 'tspan'); a.textContent = m.name; t.appendChild(a);
      const b = document.createElementNS(NS, 'tspan');
      b.setAttribute('dx', 16); b.setAttribute('font-size', S.reason); b.setAttribute('class', 't-dim');
      b.textContent = 'thinking ' + m.thinking; t.appendChild(b);
      gx = 0; gy = y + nameH;
    } else {
      const cy = y + blockH / 2;
      el(g, 'text', { x: 0, y: cy - 4, 'font-size': S.name, class: 't-ink' }).textContent = m.name;
      el(g, 'text', { x: 0, y: cy + S.reason - 2, 'font-size': S.reason, class: 't-dim' }).textContent = 'thinking ' + m.thinking;
      gx = nameW + 30; gy = y + (blockH - gridH) / 2;
    }
    const slots = el(g, 'path', { class: 'c-slot' });
    const fails = el(g, 'path', { class: 'c-no' });
    const oks = el(g, 'path', { class: 'c-ok' });
    const cyMid = gy + gridH / 2;
    const count = el(g, 'text', { x: IW, y: cyMid + S.big * 0.18, 'text-anchor': 'end', 'font-size': S.big, class: 't-ink' });
    const cBig = document.createElementNS(NS, 'tspan'); count.appendChild(cBig);
    const cDen = document.createElementNS(NS, 'tspan'); cDen.setAttribute('font-size', S.den); cDen.setAttribute('class', 't-dim'); count.appendChild(cDen);
    const time = el(g, 'text', { x: IW, y: cyMid + S.big * 0.18 + S.time + 8, 'text-anchor': 'end', 'font-size': S.time, class: 't-dim' });
    const pos = m.attempts.map((_, k) => [gx + Math.floor(k / ROWS) * pitch, gy + (k % ROWS) * pitch]);
    return { m, slots, fails, oks, count, cBig, cDen, time, pos };
  });
  const gridRight = Math.max(...rows.map(r => r.pos[r.pos.length - 1][0] + cell));
  return { cell, dot, rows, readout, fits: gridRight + 24 + rightW <= IW };
}

function renderBoard(p) {
  if (!parts) return;
  const now = p * T;
  const cs = parts.cell, ds = parts.dot, off = (cs - ds) / 2;
  const sq = (x, y) => `M${x} ${y}h${cs}v${cs}h-${cs}z`;
  const ring = (x, y) => `M${x + 0.8} ${y + 0.8}h${cs - 1.6}v${cs - 1.6}h-${cs - 1.6}z`;
  const pip = (x, y) => `M${x + off} ${y + off}h${ds}v${ds}h-${ds}z`;
  parts.rows.forEach(r => {
    let ok = '', bad = '', slot = '', solved = 0;
    const finished = now >= r.m.total_s - 1e-9;
    r.m.attempts.forEach((a, k) => {
      const [x, y] = r.pos[k];
      if (!(finished || r.m.done[k] <= now)) slot += pip(x, y);
      else if (a[0]) { ok += sq(x, y); solved++; }
      else bad += ring(x, y);
    });
    r.oks.setAttribute('d', ok);
    r.fails.setAttribute('d', bad);
    r.slots.setAttribute('d', slot);
    r.cBig.textContent = finished ? r.m.solved : solved;
    r.cDen.textContent = ' / ' + r.m.tasks;
    r.count.setAttribute('class', finished ? 't-ink txt-glow' : 't-ink');
    r.time.textContent = finished ? fmtMin(r.m.total_s) + ' agent time' : Math.floor(Math.min(now, r.m.total_s) / 60) + ' min';
    r.time.setAttribute('class', finished ? 't-ink' : 't-dim');
  });
  if (parts.readout) parts.readout.textContent = 'cumulative agent time  ' + Math.floor(now / 60) + ' min';
}

function layout() {
  for (let pitch = S.pitchMax; pitch >= S.pitchMin; pitch--) {
    parts = build(pitch);
    renderBoard(1);
    const r = document.getElementById('stage').getBoundingClientRect();
    if (parts.fits && r.bottom <= PAGE_H - S.margin / 2 && r.top >= S.margin) return pitch;
  }
  return S.pitchMin;
}

/* the cut (seconds): hold empty, fill at the pace of cumulative agent time, hold, end card */
const TL = { run: [0.6, 9.6], boardOut: [13.6, 13.8], endIn: [13.8, 14.0], end: 16.0 };
const scenes = { board: document.getElementById('board-scene'), end: document.getElementById('end') };
const ramp = (t, [a, b]) => clamp01((t - a) / (b - a));

window.DURATION = LAYOUT === 'square' ? TL.end : 0;
window.renderAt = t => {
  const bo = 1 - ramp(t, TL.boardOut), en = ramp(t, TL.endIn), p = ramp(t, TL.run);
  scenes.board.style.opacity = bo; scenes.end.style.opacity = en;
  if (bo > 0) renderBoard(p);
  return `b${bo.toFixed(3)}:${p.toFixed(5)}:e${en.toFixed(3)}`;
};
window.renderFinal = () => {
  scenes.end.style.opacity = 0; scenes.board.style.opacity = 1;
  renderBoard(1);
};

const loaded = img => img.complete && img.naturalWidth ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; });
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(loaded));
  const pitch = layout();
  window.renderFinal();
  return { pitch, height: document.getElementById('stage').getBoundingClientRect().height };
})();
</script>
</body>
</html>
