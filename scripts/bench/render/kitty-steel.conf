# Kitty at its fastest legitimate settings for the render scorecard
# (docs/RENDER_SCORECARD.md, "Pre-registered v2"). Every delay the
# defaults keep is zeroed here; if a future kitty gains another tuned
# knob that matters, it belongs in this file, in kitty's favour.
font_size 9.0
repaint_delay 0
input_delay 0
sync_to_monitor no
cursor_blink_interval 0
# White block cursor, like the operator's config: the keyframe hunt
# finds the composer cursor by its white block (kitty's #cccccc
# default is invisible to it). Visual only; no timing effect.
cursor #ffffff
cursor_text_color #000000
remember_window_size no
enable_audio_bell no
confirm_os_window_close 0
