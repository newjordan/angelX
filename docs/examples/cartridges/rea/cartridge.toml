# REA (Reverse Engineer Anything, github.com/morluto/rea, MIT) as a tool
# cartridge. Plugged in, it costs nothing until `/rea` is typed: REA's MCP
# server (207 tools) is never attached; that turn carries REA's own skill and
# drives its CLI. ./install.sh plugs it in; removing
# ~/.angelX/cartridges/rea unplugs it.
id = "rea"
label = "REA"

[plugin]
version = "1.0.0"
description = "Reverse engineer native binaries, Electron and JavaScript apps, .NET assemblies, APKs, firmware and websites with REA's CLI."
authors = ["angelX contributors"]
license = "MIT"
repository = "https://github.com/newjordan/angelX"
keywords = ["reverse-engineering", "decompile", "binaries", "electron", "apk", "firmware"]
# Installs the pinned rea-agents CLI (Node.js and npm) and REA's own skill.
setup = "install.sh"

[[commands]]
name = "rea"
usage = "<target path, app or URL> [what to find or build]"
skills = ["rea", "reverse-engineer-anything"]
