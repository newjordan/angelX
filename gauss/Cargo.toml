[package]
name = "gauss-glass"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
angel-glass = { path = "../crates/glass" }
ratatui-core = { version = "0.1.2", features = ["std", "underline-color"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }

[dependencies.bytemuck]
version = "1"
features = ["derive"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
