[package]
name = "angel-portal-renderer"
version = "0.1.0"
edition = "2024"
resolver = "3"
description = "Headless fixed-scene WebGPU renderer for the angel0 Kitty portal"
license = "MIT"

[dependencies]
pollster = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
